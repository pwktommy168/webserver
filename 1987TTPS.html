<!DOCTYPE html>

    <title>1987 TTPS Interactive Map</title>
    <style>
        .map-container {
            position: relative;
            display: inline-block;
        }

        /* 1. Golden Star Styling */
        .star {
            position: absolute;
            color: #FFD700; /* Golden color */
            font-size: 24px; /* Adjust size of the star */
            line-height: 1;
            pointer-events: none;
            /* Positioning: Center horizontally and move up */
            transform: translate(-50%, -100%);
            margin-top: -20px; /* Offset to sit above the head */
            text-shadow: 0 0 3px rgba(0, 0, 0, 0.5); /* Makes star pop against light backgrounds */
            z-index: 10;
            user-select: none;
        }

        /* 2. Tooltip Styling */
        #custom-tooltip {
            position: absolute;
            display: none;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            border-radius: 4px;
            font-size: 40px;
            font-family: sans-serif;
            pointer-events: none;
            z-index: 100;
            white-space: nowrap;
        }

    </style>
</head>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const areas = document.querySelectorAll('area');
        const container = document.getElementById('mapWrapper');
        const tooltip = document.getElementById('custom-tooltip');

        areas.forEach(area => {
            // Create Golden Stars
            const coords = area.coords.split(',');
            if (coords.length >= 2) {
                const star = document.createElement('div');
                star.className = 'star';
                star.innerHTML = '&#9733;'; // Unicode Star character
                star.style.left = coords[0] + 'px';
                star.style.top = coords[1] + 'px';
                container.appendChild(star);
            }

            // Show Tooltip on Hover
            area.addEventListener('mousemove', function(e) {
                const name = this.getAttribute('title');
                tooltip.innerText = name;
                tooltip.style.display = 'block';
                
                // Position tooltip near cursor
                tooltip.style.left = (e.pageX - container.offsetLeft + 15) + 'px';
                tooltip.style.top = (e.pageY - container.offsetTop + 15) + 'px';
            });

            // Hide Tooltip
            area.addEventListener('mouseleave', function() {
                tooltip.style.display = 'none';
            });
        });
    });
</script>
